name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: plugins/codex-conversation-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install browser test runtime
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Validate source and native app
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build universal macOS package
        if: matrix.node-version == 22
        run: npm run release:macos
