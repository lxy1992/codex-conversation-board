<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex 对话看板</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --text: #172b4d;
        --muted: #64748b;
        --line: #dfe1e6;
        --blue: #0c66e4;
        --blue-soft: #e9f2ff;
        --shadow: 0 1px 2px rgb(9 30 66 / 0.15), 0 0 1px rgb(9 30 66 / 0.22);
        --card-shadow: 0 1px 1px rgb(9 30 66 / 0.12), 0 0 1px rgb(9 30 66 / 0.16);
        --radius: 12px;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101214;
          --surface: #1d2125;
          --surface-2: #22272b;
          --text: #f1f2f4;
          --muted: #9fadbc;
          --line: #3d444c;
          --blue: #579dff;
          --blue-soft: #1c2b41;
          --shadow: 0 1px 2px rgb(0 0 0 / 0.45), 0 0 1px rgb(255 255 255 / 0.08);
          --card-shadow: 0 1px 2px rgb(0 0 0 / 0.34);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-width: 0;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      button, input, select { font: inherit; }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      .card:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      .app {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        height: 100vh;
        min-height: 440px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 93%, transparent);
      }

      .brand {
        display: flex;
        flex: 0 0 280px;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-copy { min-width: 0; }

      .brand-mark {
        display: grid;
        grid-template-columns: repeat(3, 4px);
        align-items: end;
        gap: 3px;
        width: 30px;
        height: 30px;
        padding: 7px;
        border-radius: 9px;
        background: #2563eb;
        box-shadow: 0 3px 10px rgb(37 99 235 / 0.24);
      }

      .brand-mark i {
        display: block;
        width: 4px;
        border-radius: 3px;
        background: #fff;
      }

      .brand-mark i:nth-child(1) { height: 15px; opacity: 0.78; }
      .brand-mark i:nth-child(2) { height: 10px; }
      .brand-mark i:nth-child(3) { height: 13px; opacity: 0.68; }

      .brand-copy h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .brand-copy p {
        margin: 2px 0 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .source-tabs {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface-2);
      }

      .source-tab {
        min-height: 28px;
        padding: 0 11px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      .source-tab:hover { color: var(--text); }
      .source-tab[aria-selected="true"] {
        background: var(--surface);
        color: var(--blue);
        box-shadow: var(--card-shadow);
      }

      .toolbar {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
      }

      .field {
        position: relative;
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .field svg {
        position: absolute;
        left: 10px;
        width: 15px;
        height: 15px;
        color: var(--muted);
        pointer-events: none;
      }

      .search {
        width: min(270px, 25vw);
        min-width: 140px;
        height: 34px;
        padding: 0 12px 0 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
      }

      .project-select {
        width: min(220px, 22vw);
        min-width: 130px;
        height: 34px;
        padding: 0 28px 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
      }

      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover { color: var(--blue); background: var(--blue-soft); }
      .icon-button:disabled { cursor: wait; opacity: 0.5; }
      .icon-button svg { width: 16px; height: 16px; }
      .spinning svg { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .meta-strip {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 34px;
        padding: 7px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
      }

      .meta-strip strong { color: var(--text); font-weight: 650; }

      .meta-strip .status {
        margin-left: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status[data-kind="error"] { color: #c9372c; }
      .status[data-kind="success"] { color: #1f845a; }

      .board-shell {
        min-width: 0;
        min-height: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 12px 14px 16px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(var(--column-count, 6), minmax(264px, 1fr));
        gap: 10px;
        min-width: 0;
        height: 100%;
      }

      .column {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
        border-radius: var(--radius);
        background: var(--surface-2);
      }

      .column.drag-over {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 18%, transparent);
      }

      .column-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 11px 8px;
      }

      .column-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--column-color);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--column-color) 15%, transparent);
      }

      .column-title {
        flex: 1;
        margin: 0;
        font-size: 12px;
        font-weight: 720;
        letter-spacing: 0.02em;
      }

      .count {
        min-width: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--line) 55%, transparent);
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .cards {
        min-height: 0;
        padding: 2px 8px 10px;
        overflow-y: auto;
        scrollbar-gutter: stable;
      }

      .cards:empty::after {
        content: "拖到这里";
        display: grid;
        place-items: center;
        min-height: 76px;
        border: 1px dashed var(--line);
        border-radius: 9px;
        color: var(--muted);
        font-size: 12px;
      }

      .lazy-done {
        display: grid;
        min-height: 132px;
        place-items: center;
        padding: 18px 12px;
        border: 1px dashed var(--line);
        border-radius: 9px;
        color: var(--muted);
        text-align: center;
      }

      .lazy-done p {
        margin: 0 0 10px;
        font-size: 11px;
        line-height: 1.45;
      }

      .lazy-done button {
        min-height: 30px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 11.5px;
        cursor: pointer;
      }

      .lazy-done button:hover { border-color: var(--blue); color: var(--blue); }
      .lazy-done button:disabled { cursor: wait; opacity: 0.58; }

      .lazy-column {
        min-height: 54px;
        padding: 8px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }

      .lazy-column button {
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        font-size: 11px;
        cursor: pointer;
      }

      .lazy-column button:hover { border-color: var(--blue); color: var(--blue); }

      .card {
        position: relative;
        margin: 0 0 8px;
        padding: 10px 10px 9px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: var(--surface);
        box-shadow: var(--card-shadow);
        cursor: grab;
        user-select: none;
        transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      }

      .card:hover {
        border-color: color-mix(in srgb, var(--blue) 55%, transparent);
        box-shadow: 0 2px 5px rgb(9 30 66 / 0.16);
        transform: translateY(-1px);
      }

      .card[data-activity="active"] {
        border-color: color-mix(in srgb, #1f845a 46%, transparent);
      }

      .card[data-activity="unread"] {
        border-color: color-mix(in srgb, #e56910 58%, transparent);
        box-shadow: 0 2px 6px color-mix(in srgb, #e56910 16%, transparent);
      }

      .card:active { cursor: grabbing; }
      .card.dragging { opacity: 0.38; transform: rotate(1deg); }
      .card.saving::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--blue) 10%, transparent), transparent);
        background-size: 200% 100%;
        animation: shimmer 0.9s linear infinite;
        pointer-events: none;
      }
      @keyframes shimmer { to { background-position: -200% 0; } }

      .card-title {
        margin: 0 0 9px;
      }

      .card-open-button {
        display: -webkit-box;
        width: 100%;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-size: 13px;
        font-weight: 620;
        line-height: 1.42;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .card-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--muted);
        font-size: 10.5px;
      }

      .project-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        max-width: 55%;
      }

      .project-chip::before {
        content: "";
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: hsl(var(--project-hue) 68% 53%);
      }

      .project-name, .branch {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .branch { flex: 1; text-align: right; }

      .runtime {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 5px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--line) 48%, transparent);
        white-space: nowrap;
      }

      .runtime::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #8590a2;
      }

      .runtime[data-state="active"]::before { background: #1f845a; }
      .runtime[data-state="approval"]::before,
      .runtime[data-state="input"]::before { background: #e56910; }
      .runtime[data-state="error"]::before { background: #c9372c; }

      .activity {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 6px;
        border-radius: 999px;
        font-weight: 650;
        white-space: nowrap;
      }

      .activity::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }

      .activity[data-state="active"] {
        background: color-mix(in srgb, #1f845a 14%, transparent);
        color: #1f845a;
      }

      .activity[data-state="active"]::before {
        animation: activity-pulse 1.4s ease-in-out infinite;
      }

      .activity[data-state="unread"] {
        background: color-mix(in srgb, #e56910 16%, transparent);
        color: #c25100;
      }

      @media (prefers-color-scheme: dark) {
        .activity[data-state="active"] { color: #7ee2b8; }
        .activity[data-state="unread"] { color: #f8b36b; }
      }

      @keyframes activity-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 7px;
      }

      .time {
        color: var(--muted);
        font-size: 10px;
      }

      .card-move-button {
        flex: 0 0 auto;
        min-height: 24px;
        padding: 0 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 10.5px;
        cursor: pointer;
      }

      .card-move-button:hover,
      .card-move-button[aria-expanded="true"] {
        border-color: color-mix(in srgb, var(--blue) 55%, var(--line));
        background: var(--blue-soft);
        color: var(--blue);
      }

      .card-move-button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .status-menu {
        position: fixed;
        z-index: 30;
        min-width: 148px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgb(9 30 66 / 0.24);
      }

      .status-menu[hidden] { display: none; }

      .status-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 32px;
        padding: 0 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }

      .status-menu button:hover,
      .status-menu button:focus-visible {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .status-menu-dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--status-color);
      }

      .settings-dialog {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        padding: 22px;
      }

      .settings-dialog[hidden] { display: none; }

      .settings-backdrop {
        position: absolute;
        inset: 0;
        background: rgb(9 30 66 / 0.54);
        backdrop-filter: blur(3px);
      }

      .settings-panel {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(760px, 100%);
        max-height: min(720px, calc(100vh - 44px));
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 20px 60px rgb(9 30 66 / 0.34);
      }

      .settings-header,
      .settings-footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
      }

      .settings-header {
        border-bottom: 1px solid var(--line);
      }

      .settings-header-copy { min-width: 0; flex: 1; }
      .settings-header h2 { margin: 0; font-size: 16px; }
      .settings-header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 11.5px;
      }

      .settings-body {
        min-height: 0;
        overflow: auto;
        padding: 14px 16px 16px;
      }

      .settings-help {
        margin: 0 0 11px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .settings-columns-list { display: grid; gap: 8px; }

      .settings-column-row {
        display: grid;
        grid-template-columns: 26px 34px minmax(110px, 0.8fr) minmax(160px, 1.3fr) auto;
        align-items: center;
        gap: 8px;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
      }

      .settings-column-row.dragging { opacity: 0.5; }
      .settings-column-row.drag-over { border-color: var(--blue); }

      .settings-drag-handle {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: grab;
        font-size: 16px;
        letter-spacing: -4px;
      }

      .settings-color {
        width: 30px;
        height: 30px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        cursor: pointer;
      }

      .settings-input {
        width: 100%;
        min-width: 0;
        height: 32px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        font-size: 12px;
      }

      .settings-row-actions { display: inline-flex; gap: 4px; }

      .settings-row-button {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }

      .settings-row-button:hover:not(:disabled) { color: var(--blue); border-color: var(--blue); }
      .settings-row-button[data-action="delete"]:hover:not(:disabled) { color: #c9372c; border-color: #c9372c; }
      .settings-row-button:disabled { cursor: not-allowed; opacity: 0.35; }

      .settings-add-button {
        min-height: 34px;
        margin-top: 10px;
        padding: 0 12px;
        border: 1px dashed color-mix(in srgb, var(--blue) 60%, var(--line));
        border-radius: 8px;
        background: var(--blue-soft);
        color: var(--blue);
        cursor: pointer;
      }

      .settings-migration {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
        padding: 10px 11px;
        border-radius: 9px;
        background: color-mix(in srgb, #e56910 11%, var(--surface));
        color: var(--text);
        font-size: 12px;
      }

      .settings-migration[hidden] { display: none; }
      .settings-migration span { flex: 1; }
      .settings-migration select {
        min-width: 120px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
      }

      .settings-error {
        min-height: 17px;
        margin: 8px 0 0;
        color: #c9372c;
        font-size: 11.5px;
      }

      .settings-footer {
        justify-content: flex-end;
        border-top: 1px solid var(--line);
      }

      .dialog-button {
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }

      .dialog-button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: white;
      }

      .dialog-button:disabled { cursor: wait; opacity: 0.55; }

      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 5;
        background: var(--bg);
      }

      .loading[hidden] { display: none; }

      .loading-box {
        display: grid;
        justify-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .loader {
        width: 24px;
        height: 24px;
        border: 3px solid var(--line);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .error-panel {
        max-width: 420px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .error-panel p { color: var(--muted); line-height: 1.5; }
      .retry-button {
        min-height: 34px;
        padding: 0 13px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        cursor: pointer;
      }

      @media (max-width: 720px) {
        .app { grid-template-rows: auto auto minmax(0, 1fr); }
        .topbar { align-items: flex-start; flex-wrap: wrap; }
        .brand { flex: 1; }
        .source-tabs { order: 2; }
        .toolbar { order: 2; flex-basis: 100%; justify-content: stretch; }
        .search, .project-select { width: 100%; }
        .field { flex: 1; }
        .brand-copy p { display: none; }
        .meta-strip { padding-inline: 12px; }
        .meta-strip .hint { display: none; }
        .board-shell { padding-inline: 10px; }
        .settings-dialog { padding: 8px; }
        .settings-panel { max-height: calc(100vh - 16px); }
        .settings-column-row {
          grid-template-columns: 24px 32px minmax(100px, 1fr) auto;
        }
        .settings-description { grid-column: 3 / -1; }
        .settings-migration { align-items: stretch; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-label="对话看板">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-copy">
            <h1>对话看板</h1>
            <p id="brandSubtitle">按项目和状态整理 Codex 任务</p>

        <nav class="source-tabs" role="tablist" aria-label="对话来源">
          <button class="source-tab" type="button" role="tab" data-source="codex" aria-selected="true">Codex</button>
          <button class="source-tab" type="button" role="tab" data-source="chatgpt" aria-selected="false">ChatGPT</button>
          <button class="source-tab" type="button" role="tab" data-source="claude" aria-selected="false">Claude</button>

        <div class="toolbar">
          <label class="field" aria-label="搜索对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
            <input id="search" class="search" type="search" placeholder="搜索对话或分支" autocomplete="off" />
          </label>
          <select id="projectSelect" class="project-select" aria-label="筛选项目">
            <option value="">全部项目</option>
          </select>
          <button id="refreshButton" class="icon-button" type="button" title="刷新对话" aria-label="刷新对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
          <button id="settingsButton" class="icon-button" type="button" title="设置状态与泳道顺序" aria-label="设置状态与泳道顺序">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>

          <button id="fullscreenButton" class="icon-button" type="button" title="全屏打开" aria-label="全屏打开">

      <section class="meta-strip" aria-live="polite">
        <span><strong id="visibleCount">0</strong> 个对话</span>

      <div id="columnSettingsDialog" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
        <div class="settings-backdrop" data-action="close-settings"></div>
        <section class="settings-panel">
          <header class="settings-header">
            <div class="settings-header-copy">
              <h2 id="settingsTitle">状态与泳道顺序</h2>
              <p id="settingsSourceLabel">只修改当前 Codex 看板</p>

            <div id="settingsColumnsList" class="settings-columns-list"></div>
            <button id="addColumnButton" class="settings-add-button" type="button">＋ 添加状态</button>

          <footer class="settings-footer">

            <button id="settingsSaveButton" class="dialog-button primary" type="button">保存设置</button>
