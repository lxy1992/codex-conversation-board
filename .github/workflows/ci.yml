name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: plugins/codex-conversation-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install browser test runtime
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Validate source and native app
        run: npm run check
      - name: Run tests
        # Browser tests share a generated file harness. Running the suite serially in CI
        # avoids Chromium startup and file-navigation races on constrained macOS runners.
        run: npm run test:ci
      - name: Build universal macOS package
        if: matrix.node-version == 22
        run: npm run release:macos
